<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт · Марафон ФИНИШ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/app.css?v=13">
</head>
<body>

<!-- Экран 1: люди -->
<section id="list" class="screen is-open">
  <header class="bar">
    <div class="bar__row">
      <input id="search" class="search" type="search" inputmode="search"
             placeholder="Ник, имя или ID" autocomplete="off" spellcheck="false">
    </div>
    <div class="bar__row bar__row--tabs">
      <button class="tab is-on" data-only="1" type="button">Переписки</button>
      <button class="tab" data-only="0" type="button">Все</button>
      <span id="count" class="count"></span>
      <!-- Выбрать нескольких и написать им одно и то же: AleX 20.09.2026
           «либо выбранным из списка, либо добавленным по никнейму». -->
      <button id="pick" class="tab tab--pick" type="button">Выбрать</button>
    </div>
    <!-- Кому писать разом: все или отдельный шаг воронки.
         AleX 23.09.2026: «пусть сверху будет галочка выбрать всех… или
         оповестить всех, кто на первом/втором/третьем/четвёртом дне». -->
    <div id="scopes" class="scopes" hidden></div>
  </header>
  <div id="people" class="people"></div>
  <p id="empty" class="empty" hidden>Никого не нашли</p>
  <div id="picked" class="picked" hidden>
    <span id="picked-count" class="picked__count">Выбрано: 0</span>
    <button id="picked-clear" class="picked__clear" type="button">Снять</button>
    <button id="picked-write" class="picked__write" type="button">Написать</button>
  </div>
</section>

<!-- Экран 2: диалог -->
<section id="chat" class="screen screen--chat">
  <header class="bar bar--chat">
    <button id="back" class="icon" type="button" aria-label="Назад">‹</button>
    <div class="who">
      <b id="chat-name">—</b>
      <span id="chat-sub" class="who__sub"></span>
    </div>
    <button id="info" class="ban" type="button" aria-label="Карточка участника">ℹ️</button>
    <button id="ban" class="ban" type="button">🚫</button>
  </header>
  <div id="card" class="card" hidden></div>
  <div id="log" class="log"></div>
  <form id="send" class="send">
    <div class="send__body">
      <input id="media" class="send__media" type="url" inputmode="url" hidden
             placeholder="Ссылка на фото, видео или подкаст" autocomplete="off">
      <div id="attach" class="attach" hidden>
        <span id="attach-name" class="attach__name"></span>
        <button id="attach-drop" class="attach__drop" type="button" aria-label="Убрать файл">✕</button>
      </div>
      <textarea id="text" class="send__text" rows="3" placeholder="Сообщение от имени бота"></textarea>
    </div>
    <div class="send__tools">
      <!-- Файл с устройства: картинка, видео, аудио — что угодно. -->
      <input id="file" type="file" hidden>
      <button id="pin" class="send__clip" type="button" aria-label="Файл с устройства">📁</button>
      <button id="clip" class="send__clip" type="button" aria-label="Вложение по ссылке">📎</button>
      <button id="mic" class="send__clip" type="button" aria-label="Записать голосовое">🎤</button>
      <button id="cam" class="send__clip" type="button" aria-label="Записать кружок">⭕</button>
      <button id="go" class="send__go" type="submit" aria-label="Отправить">➤</button>
    </div>
  </form>
  <div id="rec" class="rec" hidden>
    <video id="preview" class="rec__preview" playsinline muted hidden></video>
    <div class="rec__row">
      <span id="rec-dot" class="rec__dot"></span>
      <span id="rec-time" class="rec__time">0:00</span>
      <button id="rec-stop" class="rec__stop" type="button">Отправить</button>
      <button id="rec-drop" class="rec__drop" type="button">Отменить</button>
    </div>
  </div>
</section>

<div id="toast" class="toast" hidden></div>

<script src="/static/app.js?v=13"></script>
</body>
</html>
