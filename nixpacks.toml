# Кружки воронки и заставки собираются заранее, на машине разработчика,
# и в контейнер приезжают готовыми файлами. ffmpeg в контейнере нужен
# для другого — записей, которые команда наговаривает в пульте.
[phases.setup]
# ffmpeg — для голосовых и кружков, записанных в пульте: браузер
# отдаёт webm, а Telegram принимает голосовое только ogg/opus и
# кружок только квадратным mp4 (bot/record.py).
nixPkgs = ["python311", "ffmpeg"]
